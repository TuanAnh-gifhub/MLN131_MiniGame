spring.application.name=minigame_be

server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=minigame;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=dbo
spring.flyway.default-schema=dbo
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jackson.default-property-inclusion=non_null

app.security.jwt-secret=01234567890123456789012345678901
app.security.jwt-expiration-minutes=180
app.security.allowed-origins=http://localhost:5173

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.override-with-generic-response=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

