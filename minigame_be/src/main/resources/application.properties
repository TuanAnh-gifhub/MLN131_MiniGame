spring.application.name=minigame_be

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://db47816.public.databaseasp.net:1433;databaseName=db47816;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:db47816}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:code2lazy}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=dbo
spring.flyway.default-schema=dbo
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

app.security.jwt-secret=${APP_SECURITY_JWT_SECRET:01234567890123456789012345678901}
app.security.jwt-expiration-minutes=${APP_SECURITY_JWT_EXPIRATION_MINUTES:180}
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.override-with-generic-response=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
